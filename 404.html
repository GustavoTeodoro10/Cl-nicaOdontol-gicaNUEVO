<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada | Nuevo Odontologia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="assets/img/favicon.ico">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: #0A0708;
      color: #F2EDEE;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      margin: 0;
      -webkit-font-smoothing: antialiased;
    }
    .code { font-size: clamp(4rem, 15vw, 8rem); font-weight: 800; color: #8C1C2C; line-height: 1; letter-spacing: -0.04em; }
    h1 { font-size: clamp(1.25rem, 3vw, 1.75rem); font-weight: 700; margin: 1rem 0 0.75rem; }
    p  { font-size: 1rem; color: #B0A5A7; max-width: 32rem; line-height: 1.6; margin: 0 0 2rem; }
    a  {
      display: inline-flex; align-items: center;
      padding: 0.875rem 1.625rem;
      background: #8C1C2C; color: #fff;
      font-size: 0.9375rem; font-weight: 600;
      border-radius: 12px; text-decoration: none;
      transition: background 0.2s ease;
    }
    a:hover { background: #A42233; }
  </style>
</head>
<body>
  <p class="code">404</p>
  <h1>Página não encontrada</h1>
  <p>O endereço que você tentou acessar não existe ou foi movido. Volte à página inicial da Nuevo Odontologia.</p>
  <a href="/">Voltar ao início</a>
</body>
</html>
